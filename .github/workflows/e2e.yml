name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Full client lifecycle against a fake facility cache, covering the positive
# and negative flows: install, probe, on-site apply, real traffic through the
# cache, wrong-address, off-site, unmanaged-file protection, update --check,
# repo-id pin refusal, full update with attestation, uninstall.

# The harness reads this (private) repo's releases and their attestations
# with GITHUB_TOKEN: contents: read for the releases, attestations: read for
# GET /repos/{owner}/{repo}/attestations/{digest}.
permissions:
  contents: read
  attestations: read

# The jobs hand GITHUB_TOKEN to a --privileged container running repo code.
# Fork PRs (only possible if the repo is public again) are skipped; same-repo
# PRs, pushes to main and manual runs still run.
jobs:
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: ["ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fixture images
        env:
          BASE: ${{ matrix.base }}
        run: |
          docker build -t fc-cache:e2e tests/e2e/cache
          docker build -t fc-client:e2e --build-arg BASE="$BASE" -f tests/e2e/linux/client.Dockerfile tests/e2e/linux

      - name: Start cache and client (systemd) containers
        run: |
          docker network create --subnet 172.28.0.0/16 fcnet
          docker run -d --name fc-cache --network fcnet --ip 172.28.0.50 \
            --network-alias cache.facility.innovationtreehouse.org fc-cache:e2e
          docker run -d --name fc-client --network fcnet --privileged \
            -v "$PWD:/repo:ro" --tmpfs /run --tmpfs /run/lock fc-client:e2e
          sleep 6
          docker exec fc-client sh -c 'ps -p 1 -o comm='

      - name: Run harness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker exec -e GITHUB_TOKEN fc-client bash /repo/tests/e2e/linux/harness.sh

      - name: Cache request log
        if: always()
        run: docker logs fc-cache 2>&1 | tail -40

  windows-container:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Windows-container E2E (servercore ltsc2022 client, PS 5.1)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\tests\e2e\windows\run-container.ps1 -RepoRoot $PWD.Path
